<section><h2>Conheça as iniciativas</h2><div id="lista-projetos" class="grade"></div><button type="button" id="limpar-favoritos">Limpar favoritos</button><p id="aviso-storage" role="status"></p></section>

<section id="doacoes"><h2>Doações</h2><p>As contribuições previstas apoiariam as oficinas e as campanhas de alimentos.</p><ul><li>Materiais escolares e livros em bom estado.</li><li>Alimentos não perecíveis dentro da validade.</li><li>Apoio financeiro, mediante orientação por um canal oficial em uma implementação real.</li></ul><p class="aviso">Este site não recebe dinheiro nem fornece chaves de pagamento. As campanhas são fictícias.</p><button type="button" id="abrir-doacao">Como apoiar esta iniciativa</button></section>

mail">E-mail *</label><input id="email" name="email" type="email" required autocomplete="email" maxlength="150"></div><div><label for="telefone">Telefone *</label><input id="telefone" aria-describedby="telefone-ajuda" name="telefone" type="tel" required autocomplete="tel-national" maxlength="15" pattern="\([0-9]{2}\) [0-9]{4,5}\-[0-9]{4}"><small id="telefone-ajuda">Inclua o DDD: (82) 3333-4444 ou (82) 99999-0000.</small></div></div></fieldset><fieldset><legend>Endereço</legend><div class="campos"><div><label for="cep">CEP *</label><input id="cep" aria-describedby="cep-ajuda" name="cep" type="text" required inputmode="numeric" maxlength="9" autocomplete="postal-code" pattern="[0-9]{5}\-[0-9]{3}"><small id="cep-ajuda">Formato: 00000-000.</small></div><div><label for="logradouro">Logradouro *</label><input id="logradouro" name="logradouro" type="text" required autocomplete="address-line1" maxlength="100"></div><div><label for="numero">Número *</label><input id="numero" name="numero" type="text" required  maxlength="100"></div><div><label for="complemento">Complemento (opcional)</label><input id="complemento" name="complemento" type="text" autocomplete="address-line2" maxlength="100"></div><div><label for="bairro">Bairro *</label><input id="bairro" name="bairro" type="text" required  maxlength="100"></div><div><label for="cidade">Cidade *</label><input id="cidade" name="cidade" type="text" required autocomplete="address-level2" maxlength="100"></div><div><label for="estado">Estado *</label><select id="estado" name="estado" autocomplete="address-level1" required><option value="">Selecione a UF</option><option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option><option value="M
